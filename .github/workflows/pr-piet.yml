
name: PR-Piet

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Eén commando-review tegelijk per PR: comments ZONDER commando (bot-audits)
# krijgen een unieke groep zodat ze de lopende review NIET cancellen.
concurrency:
  group: >-
    pr-piet-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}${{ github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/') && format('-nc-{0}', github.event.comment.id) || '' }}
  cancel-in-progress: true

jobs:
  pr-piet:
    if: ${{ github.event.sender.type != 'Bot' }}
    uses: m0nklabs/pr-piet/.github/workflows/reusable-pr-piet.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      base_branch: ${{ github.event.pull_request.base.ref || '' }}
      # Tier-2 (glm-5.2 second opinion) uit per operator-besluit 2026-09-23 —
      # infrastructuur blijft in de reusable workflow; weer aanzetten = deze
      # regel op true.
      enable_tier2: false
      auto_describe: true
      auto_improve: true
      single_call_review: true  # EXPERIMENTEEL: 1 modelcall review+suggesties (fork); terugdraaien: false
      response_language: en-US
    secrets:
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
